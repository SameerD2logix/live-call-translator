# Self-hosted deployment (VPS). Secrets come from .env next to this file (never committed).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lct
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: lct
    volumes:
      - lct-db:/var/lib/postgresql/data
    networks: [internal]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lct -d lct"]
      interval: 10s
      retries: 5

  gateway:
    build: { context: ., target: gateway }
    restart: unless-stopped
    env_file: .env.gateway
    ports: ["127.0.0.1:3005:8787"]
    networks: [internal]
    mem_limit: 384m

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    env_file: .env.web
    ports: ["127.0.0.1:3004:3000"]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    mem_limit: 512m

networks:
  internal: {}
volumes:
  lct-db: {}
